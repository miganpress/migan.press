# 미간프레스 홈페이지를 GitHub Pages로 배포합니다.
# 언제 도나: 코드를 올렸을 때, 그리고 시트의 '사이트 업데이트'를 눌렀을 때(수동 실행). 시간마다 자동으로 돌지는 않습니다.
# 시트를 읽다 실패하면 빌드가 멈추고, 이전에 배포된 사이트가 그대로 남습니다.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 사이트 만들기 (시트를 읽어 dist/에 씀)
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# 미간프레스 홈페이지를 GitHub Pages로 배포합니다.
# 언제 도나: 코드를 올렸을 때, 그리고 시트의 '사이트 업데이트'를 눌렀을 때(수동 실행). 시간마다 자동으로 돌지는 않습니다.
# 시트를 읽다 실패하면 빌드가 멈추고, 이전에 배포된 사이트가 그대로 남습니다.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 사이트 만들기 (점검 중 - 첫 화면은 준비 중 페이지, 실제 사이트는 숨은 미리보기 주소에)
        env:
          PREVIEW_PATH: ${{ secrets.PREVIEW_PATH }}
        run: |
          mkdir -p site
          cp -a maintenance/. site/
          if [ -n "$PREVIEW_PATH" ]; then
            BASE_PATH="/$PREVIEW_PATH" python3 build.py
            cp -a dist "site/$PREVIEW_PATH"
          else
            echo "PREVIEW_PATH 비밀값이 없어 미리보기는 만들지 않습니다"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

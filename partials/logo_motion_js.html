<script>
[].slice.call(document.querySelectorAll('img.logo-motion')).forEach(function (img) {
  /* 소개 페이지 로고 모션(디자인 시스템 모션 SVG, 4.2초 한 번 재생). 화면에 다시 보이거나 누르면 처음부터 다시 재생합니다. */
  var base = img.getAttribute('src');
  function play() { img.src = base + '#' + Date.now(); }
  img.addEventListener('click', play);
  if ('IntersectionObserver' in window) {
    var seen = true;
    new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting && !seen) { seen = true; play(); }
        if (!en.isIntersecting) seen = false;
      });
    }, { threshold: 0.3 }).observe(img);
  }
});
</script>

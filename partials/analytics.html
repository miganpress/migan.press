<script>
/* 대표님 기기 제외: miganpress.com/?me=1 로 한 번 접속하면 그 브라우저는 집계하지 않음, ?me=0 으로 해제 */
(function () {
  try {
    var me = new URLSearchParams(location.search).get('me');
    if (me === '1') localStorage.setItem('migan_me', '1');
    if (me === '0') localStorage.removeItem('migan_me');
    if (localStorage.getItem('migan_me') === '1') window['ga-disable-{GA_ID}'] = true;
  } catch (e) {}
})();
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={GA_ID}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', '{GA_ID}');
/* 마케팅용 클릭 기록: 서점 링크, 보도자료·표지 내려받기, 이메일 */
document.addEventListener('click', function (ev) {
  var a = ev.target.closest && ev.target.closest('a');
  if (!a) return;
  var kind = a.getAttribute('data-ga');
  if (kind === 'store') {
    gtag('event', 'store_click', { store: a.getAttribute('data-store'), book_title: a.getAttribute('data-book') });
  } else if (kind === 'download') {
    gtag('event', 'material_download', { item: a.getAttribute('data-item'), book_title: a.getAttribute('data-book') });
  } else if ((a.getAttribute('href') || '').indexOf('mailto:') === 0) {
    gtag('event', 'email_click', { page_path: location.pathname });
  }
});
</script>
